<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Aura Web Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Using Phosphor Icons for ultra-sleek, minimalist icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #020203; /* Deepest black base */
            color: #FAFAFA;
        }

        /* Floating Animation for the Card */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .glass-card {
            background: rgba(22, 22, 26, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        /* Marquee Scrolling Text */
        .marquee-container {
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            width: 100%;
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }
        
        .marquee-content {
            display: inline-block;
            animation: scroll 8s linear infinite;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            height: 24px;
            cursor: pointer;
            position: relative;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #3C3C46;
            border-radius: 2px;
            transition: all 0.2s;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #fff;
            margin-top: -4px; /* Centers thumb on the track */
            box-shadow: 0 0 10px rgba(0, 230, 200, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        input[type=range]:hover::-webkit-slider-thumb, 
        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(0, 230, 200, 0.8);
        }

        /* Dynamic glow track generated by JS */
        .slider-glow-track {
            position: absolute;
            top: 10px;
            left: 0;
            height: 4px;
            background: #00E6C8;
            border-radius: 2px;
            pointer-events: none;
            box-shadow: 0 0 8px rgba(0, 230, 200, 0.6);
        }

        .heart-btn {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #8C8C96;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart-btn:active {
            transform: scale(0.85);
        }

        .heart-icon {
            transition: color 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .liked .heart-icon {
            color: #1DB954; /* Spotify Green */
            animation: popHeart 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popHeart {
            0% { transform: scale(1); }
            40% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* Burst Particles */
        .burst-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #1DB954;
            opacity: 0;
            pointer-events: none;
        }

        .liked .burst-particle {
            animation: particleBurst 0.6s ease-out forwards;
        }

        @keyframes particleBurst {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: var(--translate-burst) scale(0); opacity: 0; }
        }

        /* Interactive controls */
        .ctrl-btn {
            color: #FAFAFA;
            transition: all 0.2s ease;
        }
        .ctrl-btn:hover {
            color: #00E6C8;
            transform: scale(1.1);
        }
        .ctrl-btn-muted {
            color: #8C8C96;
            transition: all 0.2s ease;
        }
        .ctrl-btn-muted:hover {
            color: #FAFAFA;
        }
        .ctrl-btn-active {
            color: #00E6C8;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">

    <!-- Background Canvas for Cinematic Gradient -->
    <canvas id="bg-canvas" class="absolute inset-0 w-full h-full -z-10"></canvas>

    <!-- Hardcoded audio player linking local file -->
    <audio id="audio-player" src="Holding Onto Nothing.mp3"></audio>

    <!-- Main Player Card -->
    <div class="glass-card w-[420px] rounded-3xl p-6 flex flex-col relative z-10" id="player-container">
        
        <!-- Top Section: Art & Info -->
        <div class="flex items-center gap-4 mb-6">
            <!-- Cover Art Container -->
            <div class="relative flex-shrink-0" id="cover-container">
                <div class="w-20 h-20 rounded-2xl overflow-hidden shadow-lg relative bg-[#1e1e24]">
                    <img id="cover-art" src="ab67616d00001e029f4b66e2289f5a3d9559ce73.jpg" onerror="this.onerror=null; this.src='https://placehold.co/200x200/1e1e24/00E6C8?text=Simon';" alt="Cover Art" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Title & Artist -->
            <div class="flex-grow min-w-0 pr-2">
                <div class="marquee-container mb-1 text-lg font-bold">
                    <div class="marquee-content" id="title-text">
                        HOLDING ONTO NOTHING &nbsp; &nbsp; &nbsp; HOLDING ONTO NOTHING &nbsp; &nbsp; &nbsp; 
                    </div>
                </div>
                <div class="text-sm text-[#8C8C96] truncate" id="artist-text">Simon Elliott</div>
            </div>

            <!-- Like Button with Burst effect -->
            <div class="heart-btn h-10 w-10 flex-shrink-0" id="like-btn">
                <i class="ph-fill ph-heart text-2xl heart-icon"></i>
            </div>
        </div>

        <!-- Cinematic Waveform Visualizer -->
        <div class="w-full h-16 flex items-center justify-center mb-2">
            <canvas id="waveform-canvas" width="370" height="60" class="w-full h-full"></canvas>
        </div>

        <!-- Progress Section -->
        <div class="flex items-center gap-3 mb-6 relative">
            <span class="text-xs font-semibold text-[#8C8C96] w-8 text-right" id="time-current">0:00</span>
            <div class="flex-grow relative flex items-center">
                <div class="slider-glow-track" id="slider-glow"></div>
                <input type="range" id="progress-bar" value="0" min="0" max="100" step="0.1">
            </div>
            <span class="text-xs font-semibold text-[#8C8C96] w-8 text-left" id="time-total">0:00</span>
        </div>

        <!-- Controls Section -->
        <div class="flex items-center justify-between px-2">
            <button class="ctrl-btn-muted text-2xl" id="btn-shuffle"><i class="ph ph-shuffle"></i></button>
            
            <div class="flex items-center gap-6">
                <button class="ctrl-btn text-3xl hover:text-white" id="btn-prev"><i class="ph-fill ph-skip-back"></i></button>
                
                <!-- Main Play Button Hub -->
                <button class="w-16 h-16 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition-all shadow-[0_0_20px_rgba(255,255,255,0.3)]" id="btn-play">
                    <i class="ph-fill ph-play text-2xl ml-1" id="play-icon"></i>
                </button>
                
                <button class="ctrl-btn text-3xl hover:text-white" id="btn-next"><i class="ph-fill ph-skip-forward"></i></button>
            </div>
            
            <button class="ctrl-btn-muted text-2xl" id="btn-repeat"><i class="ph ph-repeat"></i></button>
        </div>

    </div>

    <script>
        // DOM Elements
        const audio = document.getElementById('audio-player');
        const playBtn = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const progressBar = document.getElementById('progress-bar');
        const sliderGlow = document.getElementById('slider-glow');
        const timeCurrent = document.getElementById('time-current');
        const timeTotal = document.getElementById('time-total');
        const likeBtn = document.getElementById('like-btn');
        const shuffleBtn = document.getElementById('btn-shuffle');
        const repeatBtn = document.getElementById('btn-repeat');

        // State variables
        let isPlaying = false;
        let isLiked = false;
        let isDragging = false;
        let animationTime = 0;

        // Generate burst particles for the heart button
        for (let i = 0; i < 6; i++) {
            const particle = document.createElement('div');
            particle.className = 'burst-particle';
            const angle = (i * 60) * (Math.PI / 180);
            const dist = 24;
            particle.style.setProperty('--translate-burst', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
            likeBtn.appendChild(particle);
        }

        // Format time (e.g. 185 -> 3:05)
        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Play / Pause Toggle with safe promise error handling
        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                playIcon.classList.remove('ph-pause');
                playIcon.classList.add('ph-play');
                playIcon.classList.add('ml-1');
                isPlaying = false;
            } else {
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playIcon.classList.remove('ph-play');
                        playIcon.classList.add('ph-pause');
                        playIcon.classList.remove('ml-1');
                        isPlaying = true;
                    }).catch(error => {
                        console.warn("Autoplay or source constraint handled safely:", error);
                    });
                }
            }
        });

        // Time Update (Syncing Progress Bar)
        audio.addEventListener('timeupdate', () => {
            if (!isDragging && audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100 || 0;
                progressBar.value = percent;
                updateSliderGlow(percent);
                timeCurrent.textContent = formatTime(audio.currentTime);
            }
        });

        audio.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (!repeatBtn.classList.contains('ctrl-btn-active')) {
                isPlaying = false;
                playIcon.classList.remove('ph-pause');
                playIcon.classList.add('ph-play');
                playIcon.classList.add('ml-1');
                progressBar.value = 0;
                updateSliderGlow(0);
            }
        });

        // Scrubbing (Dragging logic)
        progressBar.addEventListener('input', (e) => {
            isDragging = true;
            updateSliderGlow(e.target.value);
            if (audio.duration) {
                const targetTime = (e.target.value / 100) * audio.duration;
                timeCurrent.textContent = formatTime(targetTime);
            }
        });

        progressBar.addEventListener('change', (e) => {
            if (audio.duration) {
                const targetTime = (e.target.value / 100) * audio.duration;
                audio.currentTime = targetTime;
            }
            isDragging = false;
        });

        function updateSliderGlow(percent) {
            sliderGlow.style.width = `${percent}%`;
        }

        // Micro-Interactions
        likeBtn.addEventListener('click', () => {
            isLiked = !isLiked;
            if (isLiked) {
                likeBtn.classList.add('liked');
                likeBtn.querySelector('.heart-icon').classList.remove('ph');
                likeBtn.querySelector('.heart-icon').classList.add('ph-fill');
            } else {
                likeBtn.classList.remove('liked');
                likeBtn.querySelector('.heart-icon').classList.remove('ph-fill');
                likeBtn.querySelector('.heart-icon').classList.add('ph');
            }
        });

        shuffleBtn.addEventListener('click', () => {
            shuffleBtn.classList.toggle('ctrl-btn-muted');
            shuffleBtn.classList.toggle('ctrl-btn-active');
        });

        repeatBtn.addEventListener('click', () => {
            repeatBtn.classList.toggle('ctrl-btn-muted');
            repeatBtn.classList.toggle('ctrl-btn-active');
            audio.loop = repeatBtn.classList.contains('ctrl-btn-active');
        });

        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const waveCanvas = document.getElementById('waveform-canvas');
        const waveCtx = waveCanvas.getContext('2d');

        function resize() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            waveCanvas.width = waveCanvas.clientWidth * dpr;
            waveCanvas.height = waveCanvas.clientHeight * dpr;
            waveCtx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        for (let i = 0; i < 30; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                radius: Math.random() * 1.5 + 0.5,
                speed: Math.random() * 0.3 + 0.1,
                drift: Math.random() * 0.4 - 0.2,
                offset: Math.random() * Math.PI * 2
            });
        }

        function drawWaveform(time) {
            const w = waveCanvas.clientWidth;
            const h = waveCanvas.clientHeight;
            const centerY = h / 2;
            const numPoints = 60;
            const waveWidth = w - 40;
            const startX = 20;

            waveCtx.clearRect(0, 0, w, h);
            
            waveCtx.beginPath();
            waveCtx.strokeStyle = '#00E6C8';
            waveCtx.lineWidth = 2.5;
            waveCtx.lineCap = 'round';
            waveCtx.lineJoin = 'round';

            for (let i = 0; i < numPoints; i++) {
                const x = startX + (i / (numPoints - 1)) * waveWidth;
                const amp1 = Math.sin(time * 6 + i * 0.3);
                const amp2 = Math.cos(time * 3 - i * 0.1);
                const taper = Math.sin((i / (numPoints - 1)) * Math.PI);
                let heightMult = isPlaying ? 16 : 2; 
                let currentHeight = 1 + (Math.abs(amp1 * amp2) * heightMult * taper);
                
                if (i === 0) waveCtx.moveTo(x, centerY - currentHeight);
                else waveCtx.lineTo(x, centerY - currentHeight);
            }
            waveCtx.stroke();

            waveCtx.beginPath();
            for (let i = 0; i < numPoints; i++) {
                const x = startX + (i / (numPoints - 1)) * waveWidth;
                const amp1 = Math.sin(time * 6 + i * 0.3);
                const amp2 = Math.cos(time * 3 - i * 0.1);
                const taper = Math.sin((i / (numPoints - 1)) * Math.PI);
                let heightMult = isPlaying ? 16 : 2; 
                let currentHeight = 1 + (Math.abs(amp1 * amp2) * heightMult * taper);
                
                if (i === 0) waveCtx.moveTo(x, centerY + currentHeight);
                else waveCtx.lineTo(x, centerY + currentHeight);
            }
            waveCtx.stroke();
        }

        function drawBackground(time) {
            const w = bgCanvas.width;
            const h = bgCanvas.height;

            bgCtx.fillStyle = '#020203';
            bgCtx.fillRect(0, 0, w, h);

            const cx1 = w/2 + Math.sin(time * 0.4) * 200;
            const cy1 = h/2 + Math.cos(time * 0.3) * 150;
            const cx2 = w/2 + Math.sin(time * 0.2) * 250;
            const cy2 = h/2 + Math.cos(time * 0.5) * 200;

            let pulse = isPlaying ? (Math.sin(time * 5) * 20) : 0;

            const grd1 = bgCtx.createRadialGradient(cx1, cy1, 0, cx1, cy1, 400 + pulse);
            grd1.addColorStop(0, 'rgba(25, 25, 32, 0.4)');
            grd1.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = grd1;
            bgCtx.fillRect(0, 0, w, h);

            const grd2 = bgCtx.createRadialGradient(cx2, cy2, 0, cx2, cy2, 350 + pulse);
            grd2.addColorStop(0, 'rgba(15, 15, 20, 0.5)');
            grd2.addColorStop(1, 'rgba(0, 0, 0, 0)');
            bgCtx.fillStyle = grd2;
            bgCtx.fillRect(0, 0, w, h);

            bgCtx.fillStyle = '#ffffff';
            particles.forEach(p => {
                p.y -= p.speed;
                p.x += p.drift;
                
                if (p.y < 0) {
                    p.y = h;
                    p.x = Math.random() * w;
                }

                let alpha = 0.1 + Math.sin(time * 2 + p.offset) * 0.05;
                if (alpha < 0) alpha = 0;
                
                bgCtx.globalAlpha = alpha;
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fill();
            });
            bgCtx.globalAlpha = 1.0;
        }

        function animate() {
            animationTime += 0.016;
            drawBackground(animationTime);
            drawWaveform(animationTime);
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
